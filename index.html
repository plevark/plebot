<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plebot - Tu IA Personal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 600px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .header p { font-size: 0.85rem; opacity: 0.9; }

    .key-section {
      padding: 15px 20px;
      background: #f0f2ff;
      border-bottom: 1px solid #ddd;
    }
    .key-section label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #444;
    }
    .key-section select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background: white;
    }
    .key-section button {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .key-section button:hover { opacity: 0.9; }
    .key-section button:disabled { opacity: 0.5; cursor: not-allowed; }
    .key-display {
      display: none;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.7rem;
      font-family: monospace;
      word-break: break-all;
      max-height: 80px;
      overflow-y: auto;
    }
    .key-display.show { display: block; }
    .copy-btn {
      background: #4caf50 !important;
      margin-top: 8px !important;
      font-size: 0.9rem !important;
      padding: 8px !important;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f7f8fc;
    }
    .message {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      background: white;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .message.bot.typing { color: #999; font-style: italic; }
    .message.system {
      background: #fff3cd;
      color: #856404;
      align-self: center;
      font-size: 0.85rem;
      max-width: 90%;
      text-align: center;
    }

    .input-area {
      display: flex;
      padding: 16px;
      background: white;
      border-top: 1px solid #eee;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #eee;
      border-radius: 25px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .input-area input:focus { border-color: #667eea; }
    .input-area button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }
    .input-area button:hover { transform: scale(1.05); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 Plebot</h1>
      <p>Tu asistente personal con IA</p>
    </div>

    <!-- SECCIÓN API KEY CON SELECTOR DE SERVICIO -->
    <div class="key-section">
      <label>Elige el servicio:</label>
      <select id="servicio">
        <option value="ia">🤖 Plebot (IA)</option>
        <option value="pinterest">📌 Pinterest</option>
      </select>
      <button id="genKeyBtn" onclick="generarKey()">🔑 Generar mi API Key</button>
      <div class="key-display" id="keyDisplay"></div>
      <button class="copy-btn" id="copyBtn" onclick="copiarKey()" style="display:none;">📋 Copiar Key</button>
    </div>

    <!-- CHAT -->
    <div class="messages" id="messages">
      <div class="message system">Genera tu API Key arriba para empezar a chatear con Plebot.</div>
    </div>

    <div class="input-area">
      <input type="text" id="input" placeholder="Escribe tu mensaje..." autocomplete="off" disabled>
      <button id="send" onclick="sendMessage()" disabled>Enviar</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://mi-proxy-groq.tequieroopti.workers.dev";
    let apiKey = null;
    let conversation = [];

    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
    });

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    async function generarKey() {
      const btn = document.getElementById('genKeyBtn');
      const servicio = document.getElementById('servicio').value;
      btn.disabled = true;
      btn.textContent = '⏳ Generando...';

      try {
        const res = await fetch(`${WORKER_URL}/api-keys`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ servicio: servicio })
        });

        const data = await res.json();

        if (data.api_key) {
          apiKey = data.api_key;
          localStorage.setItem('plebot_key', apiKey);

          const display = document.getElementById('keyDisplay');
          display.textContent = apiKey;
          display.classList.add('show');
          document.getElementById('copyBtn').style.display = 'block';

          btn.textContent = '✅ Key generada';
          input.disabled = false;
          sendBtn.disabled = false;
          input.focus();

          addMessage(`✅ API Key generada para: ${servicio === 'ia' ? 'Plebot (IA)' : 'Pinterest'}`, 'system');
        } else {
          btn.textContent = '❌ Error';
          alert('Error: ' + JSON.stringify(data));
        }
      } catch (err) {
        btn.textContent = '❌ Error de conexión';
        console.error(err);
      }
    }

    function copiarKey() {
      if (!apiKey) return;
      navigator.clipboard.writeText(apiKey).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '✅ ¡Copiada!';
        setTimeout(() => btn.textContent = '📋 Copiar Key', 2000);
      });
    }

    async function sendMessage() {
      if (!apiKey) {
        alert('Primero genera tu API Key');
        return;
      }

      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      sendBtn.disabled = true;
      addMessage(text, 'user');
      conversation.push({ role: 'user', content: text });

      const typing = addMessage('Plebot está escribiendo...', 'bot typing');

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({ messages: conversation })
        });

        const data = await res.json();
        typing.remove();

        const reply = data.choices?.[0]?.message?.content || data.error || 'Error al responder.';
        addMessage(reply, 'bot');
        if (data.choices) conversation.push({ role: 'assistant', content: reply });

      } catch (err) {
        typing.remove();
        addMessage('❌ Error de conexión. Intenta de nuevo.', 'bot');
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    window.addEventListener('load', () => {
      const saved = localStorage.getItem('plebot_key');
      if (saved) {
        apiKey = saved;
        const display = document.getElementById('keyDisplay');
        display.textContent = saved;
        display.classList.add('show');
        document.getElementById('copyBtn').style.display = 'block';
        document.getElementById('genKeyBtn').textContent = '✅ Key ya generada';
        input.disabled = false;
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
      }
    });
  </script>
</body>
</html>
