<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plebot - Tu IA Personal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .chat-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
    .header p { font-size: 0.85rem; opacity: 0.9; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f7f8fc;
    }
    .message {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 80%;
      word-wrap: break-word;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      background: white;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .message.bot.typing { color: #999; font-style: italic; }
    .input-area {
      display: flex;
      padding: 16px;
      background: white;
      border-top: 1px solid #eee;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #eee;
      border-radius: 25px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .input-area input:focus { border-color: #667eea; }
    .input-area button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s;
    }
    .input-area button:hover { transform: scale(1.05); }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <h1>🤖 Plebot</h1>
      <p>Tu asistente personal con IA</p>
    </div>
    <div class="messages" id="messages">
      <div class="message bot">¡Hola! Soy Plebot. ¿En qué puedo ayudarte hoy?</div>
    </div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Escribe tu mensaje..." autocomplete="off">
      <button id="send" onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTO con la URL de tu Worker de Cloudflare
    const WORKER_URL = "https://mi-proxy-groq.tequieroopti.workers.dev/";

    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    let conversation = [];

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
    });

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      sendBtn.disabled = true;
      addMessage(text, 'user');
      conversation.push({ role: 'user', content: text });

      const typing = addMessage('Plebot está escribiendo...', 'bot typing');

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversation })
        });

        const data = await res.json();
        typing.remove();

        const reply = data.choices?.[0]?.message?.content || 'Error al responder.';
        addMessage(reply, 'bot');
        conversation.push({ role: 'assistant', content: reply });

      } catch (err) {
        typing.remove();
        addMessage('❌ Error de conexión. Intenta de nuevo.', 'bot');
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
